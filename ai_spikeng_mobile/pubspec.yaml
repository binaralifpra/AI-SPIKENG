name: ai_spikeng_mobile
description: "AI-SPIKENG — Learn English with AI-powered adaptive tutoring"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.2.2
  provider: ^6.1.2
  http: ^1.3.0
  speech_to_text: ^7.0.0
  flutter_markdown: ^0.7.4
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.2.1
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_size: 21

flutter:
  uses-material-design: true
  assets:
    - .env
